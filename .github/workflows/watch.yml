name: Premier Residences Watcher

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: premier-residences-watcher-chain
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Check Accor every 5 minutes for about 5.5 hours
        shell: bash
        run: |
          set +e
          for i in $(seq 1 66); do
            echo "===== AVAILABILITY CHECK $i / 66 ====="
            START=$(date +%s)
            python cloud_watcher.py
            RC=$?
            echo "check exit code=$RC"
            if [ "$i" -lt 66 ]; then
              END=$(date +%s)
              ELAPSED=$((END-START))
              WAIT=$((300-ELAPSED))
              if [ "$WAIT" -lt 240 ]; then WAIT=240; fi
              echo "Next check in ${WAIT}s"
              sleep "$WAIT"
            fi
          done
          exit 0

      - name: Persist watcher state
        if: always()
        shell: bash
        run: |
          git config user.name "premier-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state change to commit."
          else
            git commit -m "chore: persist watcher state [skip ci]"
            git push
          fi

      - name: Start next cloud watcher run
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/watch.yml/dispatches"
          for attempt in 1 2 3; do
            echo "Dispatching next watcher run (attempt $attempt)..."
            CODE=$(curl -sS -o /tmp/dispatch.out -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}" \
              -d '{"ref":"main"}')
            if [ "$CODE" = "204" ]; then
              echo "Next watcher run queued successfully."
              exit 0
            fi
            echo "Dispatch failed HTTP $CODE"
            cat /tmp/dispatch.out || true
            sleep 10
          done
          exit 1
