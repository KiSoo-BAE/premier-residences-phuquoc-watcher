name: Safari Premium VIP Watcher

on:
  # Recovery only. The worker itself checks every 300 seconds.
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - safari_watcher.py
      - safari_runner.py
      - .github/workflows/safari-watch.yml

permissions:
  contents: write
  actions: write

jobs:
  check:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: safari-premium-vip-worker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: pip install selenium requests
      - name: Six live checks at five-minute intervals
        run: python -u safari_runner.py loop
      - name: Start next batch or stop after tour time
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u safari_runner.py next

  recover:
    if: github.event_name != 'workflow_dispatch'
    concurrency:
      group: safari-premium-vip-recovery
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Start worker only if none is running or queued
        run: python3 -u safari_runner.py ensure
