name: Safari Premium VIP Watcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - safari_request.json
      - safari_watcher.py
      - .github/workflows/safari-watch.yml

permissions:
  contents: write

concurrency:
  group: safari-premium-vip
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: pip install selenium requests
      - name: Check exact tour and alert existing Telegram recipient
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python safari_watcher.py
      - name: Persist public availability status
        if: always()
        shell: bash
        run: |
          if [ ! -f safari_status.json ]; then exit 0; fi
          git config user.name 'safari-watcher-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add safari_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record safari availability [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
