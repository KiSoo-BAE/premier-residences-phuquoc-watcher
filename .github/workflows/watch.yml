name: Premier Residences Watcher

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/watch.yml"
      - "cloud_watcher.py"

permissions:
  contents: write

concurrency:
  group: premier-residences-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Check Accor every 5 minutes for 30 minutes
        shell: bash
        run: |
          set +e
          for i in $(seq 1 6); do
            echo "===== AVAILABILITY CHECK $i / 6 ====="
            START=$(date +%s)
            python cloud_watcher.py
            RC=$?
            echo "check exit code=$RC"
            if [ "$i" -lt 6 ]; then
              END=$(date +%s)
              ELAPSED=$((END-START))
              WAIT=$((300-ELAPSED))
              if [ "$WAIT" -lt 240 ]; then WAIT=240; fi
              echo "Next check in ${WAIT}s"
              sleep "$WAIT"
            fi
          done
          exit 0

      - name: Persist watcher state when changed
        if: always()
        shell: bash
        run: |
          git config user.name "premier-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No meaningful state change to commit."
          else
            git commit -m "chore: persist watcher state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
