name: Premier Residences Watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: premier-residences-watcher-chain
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Check Accor once
        run: python cloud_watcher.py

      - name: Persist watcher state when changed
        if: always()
        shell: bash
        run: |
          git config user.name "premier-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No meaningful state change to commit."
          else
            git commit -m "chore: persist watcher state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
